{{define "content"}}
    <div class="status">
        <p>Signed in as {{.Email}}.</p>
        <button type="button" id="logout" class="link-button">Log out</button>
    </div>
    <script>
      document.getElementById('logout').addEventListener('click', () => {
        fetch('/api/session', { method: 'DELETE' }).then(() => { location.href = '/login' })
      })
    </script>
{{end}}
