{{define "content"}}
    <div class="status">
    {{if .Email}}
        <p>Signed in as {{.Email}}.</p>
        <form method="post" action="/logout">
            <button type="submit" class="link-button">Log out</button>
        </form>
    {{else}}
        <p>Not signed in.</p>
        <p><a href="/login">Log in</a> · <a href="/signup">Sign up</a></p>
    {{end}}
    </div>
{{end}}
