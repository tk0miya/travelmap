openapi: 3.0.3
info:
  title: travelmap API
  version: unreleased
  description: >
    The OpenAPI contract for travelmap's API — paths, schemas, headers,
    and status codes for the endpoints actually implemented. That
    includes travelmap's own extensions, at paths outside `/api/v1`,
    alongside the Dawarich-compatible subset. See `docs/api-notes.md`
    for what travelmap's API is as a whole and the reasoning behind
    this contract.


    Upstream's own OpenAPI document
    (`https://raw.githubusercontent.com/Freika/dawarich/master/swagger/v1/swagger.yaml`)
    is the compatibility source of truth for the Dawarich-compatible
    part.

servers:
  - url: /

security:
  - ApiKeyQuery: []
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      summary: Liveness and compatibility check
      description: >
        Takes no credentials, but is auth-aware: a request carrying a valid
        key is answered with the authenticated form of X-Dawarich-Response.
        This is what a client checks a server URL with before anything else.
      operationId: health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "500":
          $ref: "#/components/responses/InternalServerError"
    head:
      summary: Liveness and compatibility check (headers only)
      description: >
        Identical to GET, with no response body. Registered because
        every GET route here also answers HEAD; see the note on
        GET /api/v1/users/me.
      operationId: healthHead
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login:
    post:
      summary: Exchange an email and password for an API key
      description: >
        The only way a client that starts with just a password gets the
        API key every other endpoint wants. Always answers 200 with the
        key on success; this server has no two-factor authentication to
        answer 202 with a challenge for.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/LoginOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/LoginFailed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/me:
    get:
      summary: The account the request authenticated as
      description: >
        What a client calls to confirm that the API key it was configured
        with belongs to somebody.
      operationId: usersMe
      responses:
        "200":
          $ref: "#/components/responses/UsersMeOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    head:
      summary: The account the request authenticated as (headers only)
      description: >
        Clients probe a GET route with HEAD first and read the pagination
        or presence signal off the headers before fetching the body,
        so every GET route here also answers HEAD with the same status
        and headers.
      operationId: usersMeHead
      responses:
        "200":
          $ref: "#/components/responses/UsersMeOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/points:
    get:
      summary: List the authenticated user's points
      description: >
        Optionally narrowed by start_at/end_at (RFC 3339, a bare
        YYYY-MM-DD date, or a Unix timestamp), paginated by page/per_page,
        ordered newest-first unless order=asc. See docs/api-notes.md for
        where the response shape deliberately diverges from the published
        Dawarich schema.
      operationId: listPoints
      parameters:
        - $ref: "#/components/parameters/StartAt"
        - $ref: "#/components/parameters/EndAt"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          $ref: "#/components/responses/PointsListed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    head:
      summary: List the authenticated user's points (headers only)
      description: >
        Identical to GET, with no response body. Clients probe with HEAD
        to read X-Total-Pages before fetching any page at all; see the
        note on GET /api/v1/users/me.
      operationId: listPointsHead
      parameters:
        - $ref: "#/components/parameters/StartAt"
        - $ref: "#/components/parameters/EndAt"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          $ref: "#/components/responses/PointsListed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Record a batch of GPS points
      description: >
        Takes the same GeoJSON batch as POST /api/v1/overland/batches and
        differs only in the success status. A Feature with unusable
        coordinates or an unparseable timestamp is dropped rather than
        failing the whole batch. The response body is not part of the
        compatibility contract with upstream (whose own body no client is
        known to read); `created` is the count of points actually inserted
        after deduplication.
      operationId: createPoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationsRequest"
      responses:
        "200":
          $ref: "#/components/responses/PointsCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/points/{id}:
    parameters:
      - $ref: "#/components/parameters/PointId"
    patch:
      summary: Update a point's coordinates
      description: >
        Overwrites latitude and longitude; the timestamp is never part of
        the request and never changes. id not existing, or belonging to a
        different user, both answer 404 — upstream scopes the lookup to
        the authenticated user's own points and treats the two the same.
      operationId: patchPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/PointUpdated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidPoint"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a point
      description: >
        id not existing, or belonging to a different user, both answer
        404, for the same reason as PATCH on this path.
      operationId: deletePoint
      responses:
        "200":
          $ref: "#/components/responses/PointDeleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/points/bulk_destroy:
    delete:
      summary: Delete several points at once
      description: >
        An id in point_ids that does not exist, or belongs to a different
        user, is silently skipped rather than failing the request —
        upstream's own `where(id: point_ids).destroy_all` scoping. count
        is how many were actually deleted, which can be fewer than
        point_ids named.
      operationId: bulkDeletePoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointsBulkDeleteRequest"
      responses:
        "200":
          $ref: "#/components/responses/PointsBulkDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/NoPointsSelected"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/points/tracked_months:
    get:
      summary: The years and months the user has points recorded for
      description: >
        Read from daily_stats, not points directly. Years most-recent-first;
        within a year, months in calendar order.
      operationId: trackedMonths
      responses:
        "200":
          $ref: "#/components/responses/TrackedMonthsOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    head:
      summary: The years and months the user has points recorded for (headers only)
      description: >
        Identical to GET, with no response body. See the note on
        GET /api/v1/users/me.
      operationId: trackedMonthsHead
      responses:
        "200":
          $ref: "#/components/responses/TrackedMonthsOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/stats:
    get:
      summary: Aggregate distance, point and place counts
      description: >
        Distance, point counts and country/city counts aggregated from
        daily_stats, overall and broken down by year and month. The only
        endpoint using camelCase; see docs/api-notes.md for why its
        distances are whole kilometres rather than a JSON number.
      operationId: stats
      responses:
        "200":
          $ref: "#/components/responses/StatsOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    head:
      summary: Aggregate distance, point and place counts (headers only)
      description: >
        Identical to GET, with no response body. See the note on
        GET /api/v1/users/me.
      operationId: statsHead
      responses:
        "200":
          $ref: "#/components/responses/StatsOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/overland/batches:
    post:
      summary: Record a batch of GPS points (Overland app format)
      description: >
        Identical to POST /api/v1/points, aside from the 201 success
        status and accepting the Overland iOS app's own timestamp layout
        (no colon in the zone offset) in addition to RFC 3339.
      operationId: createOverlandBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationsRequest"
      responses:
        "201":
          $ref: "#/components/responses/OverlandBatchCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /webhooks/foursquare:
    post:
      summary: Swarm (Foursquare) User Push notification
      description: >
        Receives one check-in in real time, pushed by Foursquare's own "Push
        API notifications" as the user checks in on Swarm — travelmap's own
        extension, not a Dawarich endpoint. The secret field is checked
        against foursquare.push_secret; checkin.user.id is looked up against
        foursquare_accounts to find which travelmap user it belongs to, and
        the check-in is stored (or updated in place, if already stored) for
        that user. A Foursquare user id with no linked travelmap account is
        not an error: there is simply nothing to store it against. Every
        response has an empty body.
      operationId: foursquareWebhook
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FoursquarePush"
      responses:
        "200":
          description: >
            Handled: a check-in was stored, or there was nothing to store
            (no checkin parameter, one that is not JSON, or a Foursquare
            user id with no linked travelmap account). Not an error in any
            of those cases.
        "400":
          description: The request body did not parse as a form at all.
        "401":
          description: The secret form field is missing or does not match.
        "500":
          description: The store could not be read or written.

components:
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: >
        Accepted on every endpoint here, regardless of which one upstream's
        own spec documents it for.
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        `Authorization: Bearer <api_key>`. Accepted on every endpoint here,
        regardless of which one upstream's own spec documents it for.

  parameters:
    StartAt:
      name: start_at
      in: query
      description: >
        RFC 3339, a bare YYYY-MM-DD date, or a Unix timestamp. Left
        unset, the range has no lower bound.
      schema:
        type: string
    EndAt:
      name: end_at
      in: query
      description: >
        Same formats as start_at. Left unset, defaults to the request
        time.
      schema:
        type: string
    Page:
      name: page
      in: query
      description: 1-based. Anything not a positive integer is page 1.
      schema:
        type: integer
    PerPage:
      name: per_page
      in: query
      description: Anything not a positive integer defaults to 100.
      schema:
        type: integer
    Order:
      name: order
      in: query
      description: >
        "asc" for oldest-first. Anything else — "desc", unset, or a
        value that is neither — is newest-first.
      schema:
        type: string
        enum:
          - asc
          - desc
    PointId:
      name: id
      in: path
      required: true
      description: >
        Typed as an opaque string in the published spec, but every id
        this server hands out is one of its own integer primary keys.
      schema:
        type: string

  headers:
    DawarichResponse:
      description: >
        Whether the request authenticated: "Hey, I'm alive!" if not,
        "Hey, I'm alive and authenticated!" if so. Set on every /api/v1
        response, not only GET /api/v1/health.
      schema:
        type: string
        enum:
          - "Hey, I'm alive!"
          - "Hey, I'm alive and authenticated!"
    DawarichVersion:
      description: >
        The upstream Dawarich release this server claims compatibility
        with. A compatibility claim, not this binary's own build version
        (`travelmap --version`).
      schema:
        type: string
        example: "1.12.2"

  responses:
    HealthOK:
      description: The server is reachable.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Health"
          example:
            status: ok

    LoginOK:
      description: The credentials were valid; here is the account's API key.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Login"
          example:
            user_id: 1
            email: alice@example.com
            api_key: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
            status: active
            plan: pro
            subscription_source: none
            active_until: "9999-12-31T23:59:59Z"

    LoginFailed:
      description: >
        The credentials were refused — wrong password, unknown address, or
        a malformed one. Every way of failing gets this same body; how long
        it takes does not say which addresses have accounts.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/AuthError"
          example:
            error: auth_failed
            message: Invalid email or password

    UsersMeOK:
      description: The account the request authenticated as.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/UserEnvelope"

    PointsCreated:
      description: The points were stored.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/LocationsCreated"
          example:
            created: 1

    PointsListed:
      description: The user's points for the requested range and page.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
        X-Current-Page:
          description: The page this response answers with.
          schema:
            type: integer
        X-Total-Pages:
          description: >
            The total number of pages across the whole matching range,
            not just the page fetched. 0 when nothing matches.
          schema:
            type: integer
      content:
        application/json; charset=utf-8:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Point"

    PointUpdated:
      description: The point's new coordinates were stored.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Point"

    PointDeleted:
      description: The point was deleted.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/PointDeletedBody"
          example:
            message: Point deleted successfully

    PointsBulkDeleted:
      description: Every matching point was deleted.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/PointsBulkDeletedBody"
          example:
            message: Points were successfully destroyed
            count: 2

    TrackedMonthsOK:
      description: The years and months the user has points recorded for.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TrackedMonthsYear"
          example:
            - year: 2024
              months: [Jan, Feb, Mar]

    StatsOK:
      description: Aggregate distance, point and place counts.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Stats"

    OverlandBatchCreated:
      description: The points were stored.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/LocationsCreated"
          example:
            created: 1

    BadRequest:
      description: The request body could not be read as the shape this endpoint expects.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid request body

    Unauthorized:
      description: >
        No request authenticated. The body is empty on purpose — upstream's
        `head :unauthorized`, not an oversight — so a client parsing a 401
        body gets nothing rather than something to trip over.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"

    NotFound:
      description: >
        id does not exist, or belongs to a different user — the two are
        answered the same way, matching upstream scoping every lookup to
        the authenticated user's own points.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not found

    InvalidPoint:
      description: The request body was well-formed JSON, but left out a coordinate.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid point

    NoPointsSelected:
      description: point_ids was empty.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: no points selected

    InternalServerError:
      description: >
        The server could not do what was asked, most commonly because its
        database could not be read.
      headers:
        X-Dawarich-Response:
          $ref: "#/components/headers/DawarichResponse"
        X-Dawarich-Version:
          $ref: "#/components/headers/DawarichVersion"
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal server error

  schemas:
    Error:
      type: object
      description: The body every failing request answers with, aside from the exceptions noted on specific responses.
      required:
        - error
      properties:
        error:
          type: string

    AuthError:
      type: object
      description: The body of a refused POST /api/v1/auth/login.
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    Login:
      type: object
      description: >
        The last four fields describe an upstream Cloud subscription; this
        server has no billing, so they are constants matching what a
        self-hosted upstream instance reports.
      required:
        - user_id
        - email
        - api_key
        - status
        - plan
        - subscription_source
        - active_until
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        api_key:
          type: string
        status:
          type: string
        plan:
          type: string
        subscription_source:
          type: string
        active_until:
          type: string
          description: RFC 3339, no fractional seconds.

    UserEnvelope:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      description: Carries no id; a client that needs one has the user_id of POST /api/v1/auth/login.
      required:
        - email
        - theme
        - created_at
        - updated_at
        - settings
      properties:
        email:
          type: string
        theme:
          type: string
        created_at:
          type: string
          description: RFC 3339 with millisecond precision.
        updated_at:
          type: string
          description: RFC 3339 with millisecond precision.
        settings:
          $ref: "#/components/schemas/UserSettings"

    UserSettings:
      type: object
      description: >
        A smaller set than GET /api/v1/settings answers with — the fields
        upstream's user serializer sends, in its order. Nothing here is
        stored yet; values are upstream's own defaults.
      required:
        - timezone
        - maps
        - fog_of_war_meters
        - meters_between_routes
        - preferred_map_layer
        - speed_colored_routes
        - points_rendering_mode
        - minutes_between_routes
        - time_threshold_minutes
        - merge_threshold_minutes
        - live_map_enabled
        - route_opacity
        - immich_url
        - photoprism_url
        - visits_suggestions_enabled
        - speed_color_scale
        - fog_of_war_threshold
        - globe_projection
      properties:
        timezone:
          type: string
        maps:
          $ref: "#/components/schemas/MapsPref"
        fog_of_war_meters:
          type: integer
        meters_between_routes:
          type: integer
        preferred_map_layer:
          type: string
        speed_colored_routes:
          type: boolean
        points_rendering_mode:
          type: string
        minutes_between_routes:
          type: integer
        time_threshold_minutes:
          type: integer
        merge_threshold_minutes:
          type: integer
        live_map_enabled:
          type: boolean
        route_opacity:
          type: number
        immich_url:
          type: string
          nullable: true
          description: Always null; Immich integration is a non-goal.
        photoprism_url:
          type: string
          nullable: true
          description: Always null; Photoprism integration is a non-goal.
        visits_suggestions_enabled:
          type: boolean
        speed_color_scale:
          type: string
          nullable: true
          description: Null unless the user picked a scale; upstream has no default for it.
        fog_of_war_threshold:
          type: integer
        globe_projection:
          type: boolean

    MapsPref:
      type: object
      required:
        - distance_unit
      properties:
        distance_unit:
          type: string

    LocationsRequest:
      type: object
      required:
        - locations
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Feature"

    Feature:
      type: object
      description: One GeoJSON Feature carrying a point.
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          example: Feature
        geometry:
          $ref: "#/components/schemas/Geometry"
        properties:
          $ref: "#/components/schemas/PointProperties"

    Geometry:
      type: object
      description: A GeoJSON Point, as [longitude, latitude]. A third coordinate (elevation), if sent, is ignored.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          example: Point
        coordinates:
          type: array
          minItems: 2
          items:
            type: number

    PointProperties:
      type: object
      description: >
        Every field but timestamp is optional. A Feature with unusable
        coordinates or an unparseable timestamp is dropped rather than
        failing the whole batch. speed_accuracy and track_id are accepted
        but not stored: upstream itself does not persist either to a
        column.
      properties:
        timestamp:
          type: string
          description: >
            RFC 3339, or the original Overland iOS app's layout (no colon
            in the zone offset) — both are tried.
        horizontal_accuracy:
          type: number
          nullable: true
        vertical_accuracy:
          type: number
          nullable: true
        altitude:
          type: number
          nullable: true
        speed:
          type: number
          nullable: true
        speed_accuracy:
          type: number
          nullable: true
        course:
          type: number
          nullable: true
        course_accuracy:
          type: number
          nullable: true
        battery_state:
          type: string
          nullable: true
        battery_level:
          type: number
          nullable: true
        wifi:
          type: string
          nullable: true
        track_id:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true

    LocationsCreated:
      type: object
      description: >
        Not part of the compatibility contract with upstream (whose own
        body no client is known to read). The count of points actually
        inserted after deduplication.
      required:
        - created
      properties:
        created:
          type: integer

    FoursquarePush:
      type: object
      description: >
        A Swarm User Push notification. checkin and user are each a JSON
        string rather than a nested object, matching the form field
        Foursquare actually sends.
      required:
        - checkin
        - secret
      properties:
        checkin:
          type: string
          description: A JSON-encoded FoursquareCheckin object (see that schema).
        user:
          type: string
          description: >
            JSON-encoded profile of the checked-in user. Not read by this
            server: checkin.user.id inside checkin is the join key onto a
            linked account instead.
        secret:
          type: string
          description: The shared secret this receiving application was configured with.

    FoursquareCheckin:
      type: object
      description: >
        The JSON value of FoursquarePush's own checkin field. Foursquare's
        documented sample payload and an observed push disagree about
        which fields exist at all beyond id and user, so every other
        field here is optional and unrecognised fields are ignored — for
        example editableUntil (Unix milliseconds), which says a check-in
        stays editable long after it is made, but is not itself modelled
        here.
      required:
        - id
        - user
      properties:
        id:
          type: string
          description: The check-in's own id (24 hex characters).
        createdAt:
          type: integer
          description: Unix seconds. The check-in's own time, not when this server received it.
        timeZoneOffset:
          type: integer
          nullable: true
          description: Minutes.
        shout:
          type: string
          nullable: true
          description: Absent as a key, not present as an empty string, when a check-in carries none.
        user:
          $ref: "#/components/schemas/FoursquareUser"
        venue:
          $ref: "#/components/schemas/FoursquareVenue"

    FoursquareUser:
      type: object
      description: checkin.user. Only id is read; it is the join key onto a linked account.
      required:
        - id
      properties:
        id:
          type: string
          description: >
            The Swarm account's own id, sent as a quoted string (e.g.
            "1709193") though it looks numeric — matching what
            /v2/users/self itself declares.

    FoursquareVenue:
      type: object
      description: checkin.venue, absent for a check-in made without one — a shape that has not itself been observed.
      properties:
        id:
          type: string
        name:
          type: string
          description: Localised display text.
        location:
          $ref: "#/components/schemas/FoursquareLocation"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/FoursquareCategory"

    FoursquareLocation:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        cc:
          type: string
          description: The stable country code, unlike country below.
        city:
          type: string
          description: Localised display text.
        state:
          type: string
          description: Localised display text.
        country:
          type: string
          description: >
            Localised display text: an observed push had cc "JP" while
            this came back in Japanese. What decides the language is
            undocumented.

    FoursquareCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Localised display text.
        primary:
          type: boolean
          description: >
            Marks the category this server treats as "the" category when
            a venue carries more than one.
    Point:
      type: object
      description: >
        See docs/api-notes.md's GET /api/v1/points section for why
        latitude/longitude/velocity/course/course_accuracy are strings
        rather than numbers, and why every field travelmap has no data
        for yet is sent as upstream's own "not yet populated" value
        rather than omitted.
      required:
        - id
        - latitude
        - longitude
        - timestamp
        - altitude
        - velocity
        - accuracy
        - vertical_accuracy
        - course
        - course_accuracy
        - battery_status
        - battery
        - ssid
        - tracker_id
        - created_at
        - updated_at
        - user_id
        - ping
        - topic
        - trigger
        - bssid
        - connection
        - mode
        - in_regions
        - inrids
        - raw_data
        - import_id
        - city
        - country
        - visit_id
        - geodata
      properties:
        id:
          type: integer
          format: int64
        latitude:
          type: string
        longitude:
          type: string
        timestamp:
          type: integer
          description: Unix seconds.
        altitude:
          type: number
          nullable: true
        velocity:
          type: string
          nullable: true
        accuracy:
          type: number
          nullable: true
        vertical_accuracy:
          type: number
          nullable: true
        course:
          type: string
          nullable: true
        course_accuracy:
          type: string
          nullable: true
        battery_status:
          type: string
          nullable: true
        battery:
          type: number
          nullable: true
        ssid:
          type: string
          nullable: true
        tracker_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user_id:
          type: integer
          format: int64
        ping:
          type: number
          nullable: true
          description: Always null; not stored yet.
        topic:
          type: string
          nullable: true
          description: Always null; not stored yet.
        trigger:
          type: string
          nullable: true
          description: Always null; not stored yet.
        bssid:
          type: string
          nullable: true
          description: Always null; not stored yet.
        connection:
          type: string
          nullable: true
          description: Always null; not stored yet.
        mode:
          type: number
          nullable: true
          description: Always null; not stored yet.
        in_regions:
          type: array
          items:
            type: string
          description: Always empty; region matching is not implemented.
        inrids:
          type: array
          items:
            type: string
          description: Always empty; region matching is not implemented.
        raw_data:
          type: string
          nullable: true
          description: Always null; not stored yet.
        import_id:
          type: string
          nullable: true
          description: Always null; imports are not implemented yet.
        city:
          type: string
          nullable: true
          description: Always null; reverse geocoding is not implemented yet.
        country:
          type: string
          nullable: true
          description: Always null; reverse geocoding is not implemented yet.
        visit_id:
          type: string
          nullable: true
          description: Always null; visits are not implemented yet.
        geodata:
          type: object
          description: Always empty; reverse geocoding is not implemented yet.

    PointUpdateRequest:
      type: object
      description: The body of PATCH /api/v1/points/{id}. Both coordinates are required.
      properties:
        point:
          type: object
          required:
            - latitude
            - longitude
          properties:
            latitude:
              type: number
            longitude:
              type: number

    PointDeletedBody:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    PointsBulkDeleteRequest:
      type: object
      description: The body of DELETE /api/v1/points/bulk_destroy.
      required:
        - point_ids
      properties:
        point_ids:
          type: array
          items:
            type: integer
            format: int64

    PointsBulkDeletedBody:
      type: object
      required:
        - message
        - count
      properties:
        message:
          type: string
        count:
          type: integer
          description: How many of point_ids were actually deleted.

    TrackedMonthsYear:
      type: object
      description: One year's worth of GET /api/v1/points/tracked_months.
      required:
        - year
        - months
      properties:
        year:
          type: integer
        months:
          type: array
          items:
            type: string
            description: A three-letter English month abbreviation.

    Stats:
      type: object
      description: >
        camelCase throughout, matching upstream — the one endpoint that
        departs from the rest of this API on that. See docs/api-notes.md
        for why the distance fields here and on YearlyStats are whole
        kilometres, not a fractional JSON number.
      required:
        - totalDistanceKm
        - totalPointsTracked
        - totalReverseGeocodedPoints
        - totalCountriesVisited
        - totalCitiesVisited
        - yearlyStats
      properties:
        totalDistanceKm:
          type: integer
        totalPointsTracked:
          type: integer
        totalReverseGeocodedPoints:
          type: integer
        totalCountriesVisited:
          type: integer
        totalCitiesVisited:
          type: integer
        yearlyStats:
          type: array
          items:
            $ref: "#/components/schemas/YearlyStats"

    YearlyStats:
      type: object
      description: One element of Stats.yearlyStats.
      required:
        - year
        - totalDistanceKm
        - totalCountriesVisited
        - totalCitiesVisited
        - monthlyDistanceKm
      properties:
        year:
          type: integer
        totalDistanceKm:
          type: integer
        totalCountriesVisited:
          type: integer
        totalCitiesVisited:
          type: integer
        monthlyDistanceKm:
          $ref: "#/components/schemas/MonthlyDistanceKm"

    MonthlyDistanceKm:
      type: object
      description: YearlyStats.monthlyDistanceKm, keyed by lowercase month name.
      required:
        - january
        - february
        - march
        - april
        - may
        - june
        - july
        - august
        - september
        - october
        - november
        - december
      properties:
        january:
          type: integer
        february:
          type: integer
        march:
          type: integer
        april:
          type: integer
        may:
          type: integer
        june:
          type: integer
        july:
          type: integer
        august:
          type: integer
        september:
          type: integer
        october:
          type: integer
        november:
          type: integer
        december:
          type: integer
